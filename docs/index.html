<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 송이 시세 | 전국 산지 공판가</title>
<meta name="description" content="산림조합 산지 공판장의 송이 낙찰 단가를 등급별, 공판장별로 정리합니다. 연도별 최고가와 최저가, 물량이 쏟아지는 시기까지 한눈에 볼 수 있습니다.">
<style>
:root{
  --board:#0e1a15; --card:#16281f; --rule:#22392e; --line:#2e4c3c;
  --text:#eef3ec; --text2:#a9c0b1; --text3:#708c7c;
  --gold:#e0bc55; --moss:#5f8f68; --up:#f2655a; --down:#5aa8e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--board);color:var(--text);line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:16px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:500px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.top{padding:20px 18px 18px;background:linear-gradient(180deg,#1a3026 0,#0e1a15 100%)}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:12.5px;color:var(--text3);font-weight:400;margin-top:3px;letter-spacing:0}
.datebar{display:flex;align-items:center;margin-top:16px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:5px}
.datebar select{background:none;border:none;color:var(--text);font-size:17px;
  font-weight:700;text-align:center;flex:1;padding:6px 0}
.datebar select option{background:#16281f;color:var(--text)}
.nav{width:40px;height:38px;border-radius:9px;color:var(--text2);font-size:19px}
.nav:disabled{color:#3a5347;cursor:default}
.notice{margin:14px 18px 0;padding:11px 13px;border-radius:10px;
  background:rgba(224,188,85,.10);border:1px solid rgba(224,188,85,.28);
  font-size:13px;color:#f0dda4;line-height:1.6}
.lead{padding:18px;font-size:15.5px;color:var(--text2);line-height:1.7}
.lead b{color:var(--text);font-weight:700}
.lead .big{color:var(--gold);font-size:19px;font-weight:800}
.stats{display:flex;margin:0 18px;background:var(--card);
  border:1px solid var(--rule);border-radius:12px;padding:14px 4px}
.stats div{flex:1;text-align:center}
.stats div+div{border-left:1px solid var(--rule)}
.stats dt{font-size:11.5px;color:var(--text3)}
.stats dd{font-size:17px;font-weight:700;margin-top:2px}
.sec{padding:26px 18px 22px}
.sec+.sec{border-top:1px solid var(--rule)}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec .sub{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.65}
.grade{padding:13px 0;border-bottom:1px solid var(--rule)}
.grade:last-child{border-bottom:none;padding-bottom:0}
.grade.zero{opacity:.3}
.grade .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.grade .nm{font-size:15.5px;font-weight:600}
.grade .pr{font-size:19px;font-weight:800}
.grade.best .pr{color:var(--gold)}
.grade .unit{font-size:12.5px;color:var(--text3);font-weight:400}
.grade .r2{display:flex;align-items:center;gap:11px;margin-top:8px}
.bar{flex:1;height:6px;background:#1c332a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:4px}
.grade.best .bar i{background:var(--gold)}
.kg{font-size:12.5px;color:var(--text3);min-width:76px;text-align:right}
.chg{font-size:12.5px;font-weight:700;min-width:52px;text-align:right}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--text3)}
.chg em,.cmprow em{font-style:normal;color:var(--text3);font-weight:400;margin-left:3px}
.cmp{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px;margin-top:12px}
.cmprow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:14.5px;gap:10px}
.cmprow+.cmprow{border-top:1px solid var(--rule)}
.cmprow .y{color:var(--text3);font-size:13px}
.cmprow b{font-size:16px;font-weight:700}
.cmphead{font-size:13px;color:var(--text3);margin-bottom:4px}
.chart svg{display:block;width:100%;height:120px;margin-top:14px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text3);margin-top:7px}
.zone{font-size:12.5px;color:var(--text3);font-weight:700;
  margin:18px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.site{border-bottom:1px solid var(--rule)}
.sitebtn{display:flex;width:100%;align-items:center;gap:12px;padding:14px 0;text-align:left}
.sitebtn .nm{flex:1;font-size:15.5px;font-weight:600}
.sitebtn .val{text-align:right;line-height:1.35}
.sitebtn .val b{font-size:16.5px;font-weight:700;display:block}
.sitebtn .val small{font-size:12px;color:var(--text3)}
.caret{width:26px;height:26px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center}
.site.open .caret{background:rgba(224,188,85,.16);border-color:rgba(224,188,85,.4);color:var(--gold)}
.detail{padding:2px 0 14px}
.drow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--text2)}
.drow b{color:var(--text);font-weight:700}
.drow .k{color:var(--text3);font-size:12.5px;margin-left:9px}
.empty{padding:56px 24px;text-align:center;color:var(--text2);font-size:15px}
.foot{padding:22px 18px 46px;font-size:12px;color:var(--text3);line-height:1.9;border-top:1px solid var(--rule)}
.foot a{color:var(--text2)}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gtab{font-size:12.5px;padding:7px 11px;border-radius:999px;
  border:1px solid var(--rule);color:var(--text3)}
.gtab.on{background:rgba(224,188,85,.14);border-color:rgba(224,188,85,.45);color:var(--gold);font-weight:700}
.verdict{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:15px;margin-top:14px;font-size:15px;line-height:1.75;color:var(--text2)}
.verdict b{color:var(--text);font-weight:700}
.verdict .hi{color:var(--up);font-weight:700}
.verdict .lo{color:var(--down);font-weight:700}
.verdict .vol{color:var(--moss);font-weight:700}
.subhead{margin-top:22px;color:#a9c0b1;font-size:13px;font-weight:700}
.ybox{border-bottom:1px solid var(--rule);padding:13px 0}
.ybox:last-child{border-bottom:none}
.ybox .yy{font-weight:800;font-size:15.5px;margin-bottom:7px}
.yline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.yline .lbl{color:var(--text3);flex:none}
.yline .v{text-align:right}
.yline .hi{color:var(--up);font-weight:700}
.yline .lo{color:var(--down);font-weight:700}
.yline .pk{color:var(--gold);font-weight:700}
.yline .vl{color:var(--moss);font-weight:700}
.yline .who{color:var(--text3);font-size:12px;display:block}
.srow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.srow .sl{width:62px;flex:none;color:var(--text2)}
.srow .sb{flex:1;height:16px;background:#1c332a;border-radius:4px;overflow:hidden}
.srow .sb i{display:block;height:100%;background:var(--moss);border-radius:4px}
.srow.max .sb i{background:var(--up)}
.srow.min .sb i{background:var(--down)}
.srow.vmax .sb i{background:var(--gold)}
.srow .sv{width:82px;flex:none;text-align:right;color:var(--text3);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">오늘의 송이 시세<small>전국 산지 공판장 등급별 낙찰 단가</small></div>
    <div class="datebar">
      <button class="nav" id="prev">&lsaquo;</button>
      <select id="dateSel" class="num"></select>
      <button class="nav" id="next">&rsaquo;</button>
    </div>
  </header>
  <div id="notice"></div>
  <main id="main"><div class="empty">불러오는 중…</div></main>
  <footer class="foot">
    단가는 등급별 낙찰 평균 단가이며, 현지 판매가격이 아닙니다.<br>
    자료 출처: 산림조합중앙회 송이 공판현황<br>
    <a href="https://m.nfcf.or.kr/forest/user.tdf?a=user.songi.SongiApp&amp;c=1003&amp;mc=MOB_CST01" target="_blank" rel="noopener">원본 페이지 보기</a>
  </footer>
</div>
<script>
var GRADES = ["1등품","2등품","생장정지품","개산품","등외품","혼합품"];
var ZONES = [
  ["강원권", ["강원"]],
  ["경북권", ["경북","대구"]],
  ["경남·전라권", ["경남","전남","전북","광주","부산","울산"]],
  ["충청·경기권", ["충북","충남","경기","세종","대전","인천"]]
];
var SPANS = [
  ["9월 초순", 9, 1, 10], ["9월 중순", 9, 11, 20], ["9월 하순", 9, 21, 31],
  ["10월 초순", 10, 1, 10], ["10월 중순", 10, 11, 20], ["10월 하순", 10, 21, 31],
  ["11월 초순", 11, 1, 10], ["11월 중순", 11, 11, 30]
];
var MINKG = 1;
var dates = [], cache = {}, opened = {}, pickGrade = '전체 평균', allLoaded = null;

function won(n){ return Math.round(n).toLocaleString('ko-KR'); }
function load(d){
  if(cache[d]) return Promise.resolve(cache[d]);
  return fetch('data/' + d + '.json').then(function(res){
    if(!res.ok) throw new Error('없음');
    return res.json();
  }).then(function(j){ cache[d] = j; return j; });
}
function sum(r){
  var kg = 0, amt = 0;
  for(var i=0;i<GRADES.length;i++){
    var v = r.grades[GRADES[i]];
    if(v){ kg += v.kg; amt += v.kg * v.price; }
  }
  return {kg: kg, amt: amt};
}
function allOf(x){
  for(var i=0;i<x.regions.length;i++) if(x.regions[i].name === '전체') return x.regions[i];
  return x.regions[0];
}
function priceOf(r, g){ return (r.grades[g] && r.grades[g].price) || 0; }
function kgOf(r, g){
  if(g === '전체 평균') return sum(r).kg;
  return (r.grades[g] && r.grades[g].kg) || 0;
}
function topGrade(r){
  for(var i=0;i<GRADES.length;i++) if(priceOf(r, GRADES[i]) > 0) return GRADES[i];
  return null;
}
function valueOf(all, g){
  if(g === '전체 평균'){
    var t = sum(all);
    return t.kg > 0 ? t.amt / t.kg : 0;
  }
  return priceOf(all, g);
}
function extremesOf(x, g){
  var all = allOf(x);
  var hi = null, lo = null;
  for(var i=0;i<x.regions.length;i++){
    var r = x.regions[i];
    if(r === all) continue;
    var v = valueOf(r, g), kg = kgOf(r, g);
    if(!(v > 0) || !(kg > 0)) continue;
    if(!hi || v > hi.v) hi = {v: v, kg: kg, who: r.name};
    if(kg >= MINKG && (!lo || v < lo.v)) lo = {v: v, kg: kg, who: r.name};
  }
  return {hi: hi, lo: lo};
}
function delta(cur, prev, cls){
  if(!prev || !cur) return '<span class="' + cls + ' flat">—</span>';
  var diff = cur - prev, pct = diff / prev * 100;
  var dir = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
  var mark = diff > 0 ? '▲' : (diff < 0 ? '▼' : '―');
  return '<span class="' + cls + ' ' + dir + '">' + mark + ' ' + won(Math.abs(diff)) +
    '<em>' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%</em></span>';
}
function zoneOf(name){
  for(var i=0;i<ZONES.length;i++){
    var keys = ZONES[i][1];
    for(var k=0;k<keys.length;k++) if(name.indexOf(keys[k]) === 0) return ZONES[i][0];
  }
  return '기타';
}
function nearestInYear(cur, year){
  var p = cur.split('-');
  var target = new Date(year, Number(p[1]) - 1, Number(p[2]));
  var best = null, gap = Infinity;
  for(var i=0;i<dates.length;i++){
    var s = dates[i];
    if(s.slice(0,4) !== String(year)) continue;
    var q = s.split('-');
    var diff = Math.abs(new Date(Number(q[0]), Number(q[1]) - 1, Number(q[2])) - target);
    if(diff < gap){ gap = diff; best = s; }
  }
  return gap <= 7 * 86400000 ? best : null;
}
function mdText(s){ return Number(s.slice(5,7)) + '월 ' + Number(s.slice(8,10)) + '일'; }

function loadAll(){
  if(allLoaded) return allLoaded;
  allLoaded = Promise.all(dates.map(function(d){
    return load(d).then(function(x){ return {d: d, x: x, all: allOf(x)}; })
                  .catch(function(){ return null; });
  })).then(function(a){ return a.filter(function(r){ return r; }); });
  return allLoaded;
}

function renderCheap(){
  var box = document.getElementById('cheapBox');
  if(!box) return;
  loadAll().then(function(rows){
    var g = pickGrade;
    var byYear = {};
    rows.forEach(function(r){
      var v = valueOf(r.all, g);
      if(!(v > 0)) return;
      var y = r.d.slice(0,4);
      if(!byYear[y]) byYear[y] = [];
      byYear[y].push({d: r.d, v: v, kg: kgOf(r.all, g), x: r.x});
    });
    var years = Object.keys(byYear).sort().reverse();
    if(!years.length){
      box.innerHTML = '<div class="sub" style="margin-top:14px">이 등급은 자료가 부족합니다.</div>';
      return;
    }

    var yearHtml = years.map(function(y){
      var arr = byYear[y];
      var hi = arr[0], lo = arr[0], volDay = arr[0];
      var pkHi = null, pkLo = null;
      arr.forEach(function(p){
        if(p.v > hi.v) hi = p;
        if(p.v < lo.v) lo = p;
        if(p.kg > volDay.kg) volDay = p;
        var ex = extremesOf(p.x, g);
        if(ex.hi && (!pkHi || ex.hi.v > pkHi.v)) pkHi = {v: ex.hi.v, kg: ex.hi.kg, who: ex.hi.who, d: p.d};
        if(ex.lo && (!pkLo || ex.lo.v < pkLo.v)) pkLo = {v: ex.lo.v, kg: ex.lo.kg, who: ex.lo.who, d: p.d};
      });
      var out = '<div class="ybox"><div class="yy num">' + y + '년</div>' +
        '<div class="yline"><span class="lbl">전국 평균 최고</span><span class="v">' +
        '<span class="hi num">' + won(hi.v) + '원</span><span class="who">' + mdText(hi.d) + '</span></span></div>' +
        '<div class="yline"><span class="lbl">전국 평균 최저</span><span class="v">' +
        '<span class="lo num">' + won(lo.v) + '원</span><span class="who">' + mdText(lo.d) + '</span></span></div>';
      if(pkHi){
        out += '<div class="yline"><span class="lbl">최고 낙찰 공판장</span><span class="v">' +
          '<span class="pk num">' + won(pkHi.v) + '원</span><span class="who">' +
          mdText(pkHi.d) + ' · ' + pkHi.who + ' · ' + pkHi.kg.toFixed(1) + 'kg</span></span></div>';
      }
      if(pkLo){
        out += '<div class="yline"><span class="lbl">최저 낙찰 공판장</span><span class="v">' +
          '<span class="lo num">' + won(pkLo.v) + '원</span><span class="who">' +
          mdText(pkLo.d) + ' · ' + pkLo.who + ' · ' + pkLo.kg.toFixed(1) + 'kg</span></span></div>';
      }
      out += '<div class="yline"><span class="lbl">물량 최대일</span><span class="v">' +
        '<span class="vl num">' + won(volDay.kg) + 'kg</span><span class="who">' +
        mdText(volDay.d) + ' · ' + won(volDay.v) + '원</span></span></div></div>';
      return out;
    }).join('');

    var bp = SPANS.map(function(){ return {s: 0, n: 0}; });
    var bv = SPANS.map(function(){ return {s: 0, n: 0}; });
    rows.forEach(function(r){
      var v = valueOf(r.all, g), kg = kgOf(r.all, g);
      var m = Number(r.d.slice(5,7)), dd = Number(r.d.slice(8,10));
      for(var i=0;i<SPANS.length;i++){
        if(m === SPANS[i][1] && dd >= SPANS[i][2] && dd <= SPANS[i][3]){
          if(v > 0){ bp[i].s += v; bp[i].n++; }
          if(kg > 0){ bv[i].s += kg; bv[i].n++; }
          break;
        }
      }
    });
    var pAvg = bp.map(function(b){ return b.n ? b.s / b.n : 0; });
    var vAvg = bv.map(function(b){ return b.n ? b.s / b.n : 0; });
    var pLive = pAvg.filter(function(v){ return v > 0; });
    var vLive = vAvg.filter(function(v){ return v > 0; });
    if(!pLive.length){ box.innerHTML = yearHtml; return; }

    var pMax = Math.max.apply(null, pLive), pMin = Math.min.apply(null, pLive);
    var vMax = vLive.length ? Math.max.apply(null, vLive) : 0;
    var hiName = '', loName = '', volName = '';
    var priceRows = SPANS.map(function(sp, i){
      var v = pAvg[i];
      if(!(v > 0)) return '';
      var cls = v === pMax ? 'max' : (v === pMin ? 'min' : '');
      if(v === pMax) hiName = sp[0];
      if(v === pMin) loName = sp[0];
      return '<div class="srow ' + cls + '"><span class="sl">' + sp[0] + '</span>' +
        '<span class="sb"><i style="width:' + (v / pMax * 100).toFixed(1) + '%"></i></span>' +
        '<span class="sv num">' + won(v) + '원</span></div>';
    }).join('');
    var volRows = SPANS.map(function(sp, i){
      var v = vAvg[i];
      if(!(v > 0) || !vMax) return '';
      var cls = v === vMax ? 'vmax' : '';
      if(v === vMax) volName = sp[0];
      return '<div class="srow ' + cls + '"><span class="sl">' + sp[0] + '</span>' +
        '<span class="sb"><i style="width:' + (v / vMax * 100).toFixed(1) + '%"></i></span>' +
        '<span class="sv num">' + won(v) + 'kg</span></div>';
    }).join('');

    var pct = pMin > 0 ? Math.round((pMax - pMin) / pMin * 100) : 0;
    var verdict = '<div class="verdict">지난 ' + years.length + '개 시즌 <b>' + g + '</b> 기준으로, ' +
      '<span class="hi">' + hiName + '</span>이 가장 비싸고 <span class="lo">' + loName + '</span>이 가장 쌌습니다.' +
      (pct ? ' 두 시기의 차이는 <b>' + pct + '%</b>입니다.' : '') +
      (volName ? ' 물량은 <span class="vol">' + volName + '</span>에 가장 많이 쏟아졌습니다.' : '') + '</div>';

    box.innerHTML = verdict +
      '<div class="subhead">연도별 기록</div>' + yearHtml +
      '<div class="sub" style="margin-top:8px">전국 평균은 그날 전국 거래금액을 물량으로 나눈 값입니다. ' +
      '최고·최저 낙찰은 한 공판장에서 나온 값이며, 최저는 ' + MINKG + 'kg 이상 거래된 곳만 셉니다.</div>' +
      '<div class="subhead">시기별 평균 단가 (' + years.length + '개 시즌)</div>' +
      '<div style="margin-top:8px">' + priceRows + '</div>' +
      '<div class="sub" style="margin-top:9px">붉은 막대가 가장 비싼 시기, 푸른 막대가 가장 싼 시기입니다.</div>' +
      (volRows ? '<div class="subhead">시기별 평균 물량</div>' +
        '<div style="margin-top:8px">' + volRows + '</div>' +
        '<div class="sub" style="margin-top:9px">금색 막대가 물량이 가장 많이 나오는 시기입니다. ' +
        '물량이 몰리는 때에 값이 내려가는 흐름을 함께 보세요.</div>' : '');
  });
}

function compare(cur){
  var el = document.getElementById('cmpBox');
  if(!el) return;
  var year = Number(cur.slice(0,4));
  var want = [];
  for(var y = year; y >= year - 2; y--){
    var s = nearestInYear(cur, y);
    if(s) want.push(s);
  }
  Promise.all(want.map(function(s){
    return load(s).then(function(x){ return {s: s, all: allOf(x)}; })
                  .catch(function(){ return null; });
  })).then(function(rows){
    rows = rows.filter(function(r){ return r; });
    if(rows.length < 2){
      el.innerHTML = '<div class="sub" style="margin-top:12px">비교할 지난 자료가 아직 없습니다.</div>';
      return;
    }
    var common = null;
    for(var i=0;i<GRADES.length;i++){
      var g = GRADES[i], ok = true;
      for(var j=0;j<rows.length;j++) if(priceOf(rows[j].all, g) <= 0) ok = false;
      if(ok){ common = g; break; }
    }
    var basePrice = common ? priceOf(rows[0].all, common) : 0;
    var body = rows.map(function(r, i){
      var g = common || topGrade(r.all);
      var p = g ? priceOf(r.all, g) : 0;
      var tail = '';
      if(common && i > 0 && p > 0){
        var pct = Math.round((basePrice - p) / p * 100);
        var dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
        tail = '<em class="' + dir + '" style="font-weight:700">' + (pct > 0 ? '+' : '') + pct + '%</em>';
      }
      return '<div class="cmprow"><span><b class="num">' + r.s.slice(0,4) + '년</b> ' +
        '<span class="y num">' + r.s.slice(5).replace('-','.') + '</span> ' +
        '<span class="y">' + (g || '-') + '</span></span>' +
        '<span><b class="num">' + (p ? won(p) : '-') + '</b> 원 ' + tail + '</span></div>';
    }).join('');
    el.innerHTML = '<div class="cmp"><div class="cmphead">' +
      cur.slice(5).replace('-','월 ') + '일 무렵 · ' +
      (common ? common + ' 기준' : '등급이 달라 단순 비교 불가') + '</div>' + body + '</div>' +
      '<div class="sub" style="margin-top:9px">' + (common
        ? '모든 해에 거래된 ' + common + ' 단가로 맞춰 비교했습니다. 옆 숫자는 그해 대비 오르내린 폭입니다.'
        : '해마다 거래된 등급이 달라 각 해의 최고 등급만 나란히 보여드립니다. 등급이 다르므로 증감률은 표시하지 않습니다.') + '</div>';
  });
}

function chart(cur){
  var year = cur.slice(0,4);
  var list = dates.filter(function(d){ return d.slice(0,4) === year; }).sort();
  Promise.all(list.map(function(d){
    return load(d).then(function(x){ return {d: d, v: priceOf(allOf(x), '1등품')}; })
                  .catch(function(){ return null; });
  })).then(function(arr){
    var pts = arr.filter(function(p){ return p && p.v > 0; });
    var el = document.getElementById('chartBox');
    if(!el) return;
    if(pts.length < 2){ el.innerHTML = '<div class="sub">그릴 자료가 아직 부족합니다.</div>'; return; }
    var W = 440, H = 104;
    var vs = pts.map(function(p){ return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    var X = function(i){ return i / (pts.length - 1) * W; };
    var Y = function(v){ return H - (v - mn) / ((mx - mn) || 1) * H; };
    var line = pts.map(function(p, i){
      return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.v).toFixed(1);
    }).join(' ');
    var idx = -1;
    for(var i=0;i<pts.length;i++) if(pts[i].d === cur) idx = i;
    var dot = idx >= 0
      ? '<circle cx="' + X(idx) + '" cy="' + Y(pts[idx].v) + '" r="5" fill="#0e1a15" stroke="#e0bc55" stroke-width="2.2" vector-effect="non-scaling-stroke"/>'
      : '';
    el.innerHTML = '<svg viewBox="-4 -8 ' + (W+8) + ' ' + (H+16) + '" preserveAspectRatio="none">' +
      '<path d="' + line + ' L' + W + ',' + (H+8) + ' L0,' + (H+8) + ' Z" fill="rgba(224,188,85,.10)"/>' +
      '<path d="' + line + '" fill="none" stroke="#e0bc55" stroke-width="2.2" vector-effect="non-scaling-stroke"/>' +
      dot + '</svg>' +
      '<div class="axis num"><span>' + pts[0].d.slice(5).replace('-','.') + '</span>' +
      '<span>최저 ' + won(mn) + ' · 최고 ' + won(mx) + '</span>' +
      '<span>' + pts[pts.length-1].d.slice(5).replace('-','.') + '</span></div>';
  });
}

function season(cur){
  var year = cur.slice(0,4);
  var list = dates.filter(function(d){ return d.slice(0,4) === year; });
  Promise.all(list.map(function(d){
    return load(d).then(function(x){
      var a = allOf(x);
      return {d: d, kg: sum(a).kg, p: priceOf(a, '1등품')};
    }).catch(function(){ return null; });
  })).then(function(arr){
    var best = 0, bestDay = '', totKg = 0, days = 0;
    arr.forEach(function(r){
      if(!r) return;
      if(r.kg > 0) days++;
      totKg += r.kg;
      if(r.p > best){ best = r.p; bestDay = r.d; }
    });
    var el = document.getElementById('seasonBox');
    if(!el) return;
    el.innerHTML = '<dl class="stats num" style="margin:12px 0 0">' +
      '<div><dt>1등품 최고가</dt><dd>' + (best ? won(best) : '-') + '</dd></div>' +
      '<div><dt>누적 물량</dt><dd>' + won(totKg) + ' kg</dd></div>' +
      '<div><dt>공판 일수</dt><dd>' + days + ' 일</dd></div></dl>' +
      (best ? '<div class="sub" style="margin-top:9px">' + year + '년 1등품 최고가는 ' +
        bestDay.slice(5).replace('-','월 ') + '일 ' + won(best) + '원이었습니다.</div>' : '');
  });
}

function render(d){
  var main = document.getElementById('main');
  main.innerHTML = '<div class="empty">불러오는 중…</div>';
  document.getElementById('dateSel').value = d;
  var i = dates.indexOf(d);
  document.getElementById('prev').disabled = i >= dates.length - 1;
  document.getElementById('next').disabled = i <= 0;

  var prevPromise = (i < dates.length - 1)
    ? load(dates[i+1]).then(function(x){ return allOf(x); }).catch(function(){ return null; })
    : Promise.resolve(null);

  Promise.all([load(d), prevPromise]).then(function(res){
    var data = res[0], prev = res[1];
    var all = allOf(data);
    var regions = data.regions.filter(function(r){ return r !== all && sum(r).kg > 0; });
    var t = sum(all);
    var kgs = GRADES.map(function(g){ return (all.grades[g] && all.grades[g].kg) || 0; });
    var maxKg = Math.max.apply(null, kgs.concat([1]));
    var bestName = topGrade(all);
    var bestIdx = bestName ? GRADES.indexOf(bestName) : -1;
    var bestPrice = bestName ? priceOf(all, bestName) : 0;
    var md = d.slice(5).replace('-','월 ') + '일';

    var grouped = {};
    regions.forEach(function(r){
      var z = zoneOf(r.name);
      if(!grouped[z]) grouped[z] = [];
      grouped[z].push(r);
    });
    var order = ZONES.map(function(z){ return z[0]; }).concat('기타')
      .filter(function(z){ return grouped[z]; });

    var gradeHtml = GRADES.map(function(g, k){
      var v = all.grades[g];
      if(!v) return '';
      var pv = prev ? priceOf(prev, g) : 0;
      var zero = !(v.price > 0);
      return '<div class="grade ' + (k === bestIdx ? 'best' : '') + ' ' + (zero ? 'zero' : '') + '">' +
        '<div class="r1"><span class="nm">' + g + '</span><span class="pr num">' +
        (zero ? '<span style="font-size:14px;font-weight:400;color:#708c7c">거래 없음</span>'
              : won(v.price) + '<span class="unit"> 원</span>') + '</span></div>' +
        '<div class="r2"><span class="bar"><i style="width:' + (v.kg / maxKg * 100).toFixed(1) + '%"></i></span>' +
        '<span class="kg num">' + v.kg.toFixed(1) + ' kg</span>' +
        (zero ? '<span class="chg flat"></span>' : delta(v.price, pv, 'chg')) + '</div></div>';
    }).join('');

    var siteHtml = order.map(function(z){
      var arr = grouped[z].slice().sort(function(a, b){
        var ga = topGrade(a), gb = topGrade(b);
        var ia = ga ? GRADES.indexOf(ga) : 99, ib = gb ? GRADES.indexOf(gb) : 99;
        if(ia !== ib) return ia - ib;
        return (gb ? priceOf(b, gb) : 0) - (ga ? priceOf(a, ga) : 0);
      });
      return '<div class="zone">' + z + '</div>' + arr.map(function(r){
        var op = opened[r.name];
        var rt = sum(r);
        var top = topGrade(r);
        var topKg = top ? (r.grades[top].kg || 0) : 0;
        var detail = '';
        if(op){
          detail = '<div class="detail">' + GRADES.map(function(g){
            var v = r.grades[g];
            if(!v || !(v.kg > 0)) return '';
            return '<div class="drow"><span>' + g + '</span><span><b class="num">' +
              won(v.price) + '</b> 원<span class="k num">' + v.kg.toFixed(1) + ' kg</span></span></div>';
          }).join('') + '</div>';
        }
        return '<div class="site ' + (op ? 'open' : '') + '">' +
          '<button class="sitebtn" data-site="' + r.name + '">' +
          '<span class="nm">' + r.name + '</span>' +
          '<span class="val num"><b>' + (top ? won(priceOf(r, top)) : '-') + '</b>' +
          '<small>' + (top ? top + ' ' + topKg.toFixed(1) + 'kg · 총 ' + rt.kg.toFixed(1) + 'kg'
                           : '총 ' + rt.kg.toFixed(1) + 'kg') + '</small></span>' +
          '<span class="caret">' + (op ? '▲' : '▼') + '</span></button>' + detail + '</div>';
      }).join('');
    }).join('');

    var tabs = ['전체 평균'].concat(GRADES).map(function(g){
      return '<button class="gtab ' + (g === pickGrade ? 'on' : '') + '" data-grade="' + g + '">' + g + '</button>';
    }).join('');

    main.innerHTML =
      '<p class="lead">' + md + ' 공판에서 전국 <b>' + regions.length + '곳</b>이 열렸습니다. ' +
      (bestName ? '가장 높은 등급은 <b>' + bestName + '</b>으로 <span class="big num">' +
        won(bestPrice) + '</span>원이었습니다.' : '거래된 물량이 없습니다.') + '</p>' +
      '<dl class="stats num">' +
      '<div><dt>총 물량</dt><dd>' + t.kg.toFixed(1) + ' kg</dd></div>' +
      '<div><dt>총 금액</dt><dd>' + won(t.amt / 10000) + ' 만원</dd></div>' +
      '<div><dt>공판장</dt><dd>' + regions.length + ' 곳</dd></div></dl>' +
      '<section class="sec"><h2>등급별 전국 낙찰단가</h2>' +
      '<div class="sub">전국 공판장을 합산한 물량 가중평균입니다.<br>막대는 물량 비중, 오른쪽은 직전 공판일 대비 증감입니다.</div>' +
      '<div style="margin-top:14px">' + gradeHtml + '</div></section>' +
      '<section class="sec"><h2>언제가 싸고 언제가 비쌀까</h2>' +
      '<div class="sub">지난 시즌들을 모아 본 시기별 흐름입니다. 등급을 눌러 바꿔 보세요.</div>' +
      '<div class="gtabs" id="gtabs">' + tabs + '</div>' +
      '<div id="cheapBox"><div class="sub" style="margin-top:14px">집계 중…</div></div></section>' +
      '<section class="sec"><h2>작년 이맘때와 비교</h2>' +
      '<div class="sub">같은 시기 공판일을 나란히 놓았습니다.</div>' +
      '<div id="cmpBox"><div class="sub" style="margin-top:12px">불러오는 중…</div></div></section>' +
      '<section class="sec"><h2>공판장별 낙찰단가</h2>' +
      '<div class="sub">지역권으로 묶었습니다. 큰 숫자는 그 공판장 최고 등급 단가입니다.<br>눌러서 등급별로 펼쳐 보세요.</div>' + siteHtml + '</section>' +
      '<section class="sec"><h2>' + d.slice(0,4) + '년 시즌 기록</h2>' +
      '<div class="sub">그해 공판이 시작된 뒤 지금까지의 누계입니다.</div>' +
      '<div id="seasonBox"><div class="sub" style="margin-top:12px">집계 중…</div></div></section>' +
      '<section class="sec"><h2>' + d.slice(0,4) + '년 1등품 단가 추이</h2>' +
      '<div class="chart" id="chartBox"><div class="sub">그리는 중…</div></div></section>';

    renderCheap();
    compare(d);
    season(d);
    chart(d);
  }).catch(function(){
    main.innerHTML = '<div class="empty">이 날은 공판 자료가 없습니다.</div>';
  });
}

document.addEventListener('click', function(e){
  if(!e.target.closest) return;
  var g = e.target.closest('.gtab');
  if(g){
    pickGrade = g.getAttribute('data-grade');
    var tabs = document.querySelectorAll('.gtab');
    for(var i=0;i<tabs.length;i++){
      if(tabs[i].getAttribute('data-grade') === pickGrade) tabs[i].className = 'gtab on';
      else tabs[i].className = 'gtab';
    }
    document.getElementById('cheapBox').innerHTML = '<div class="sub" style="margin-top:14px">집계 중…</div>';
    renderCheap();
    return;
  }
  var b = e.target.closest('.sitebtn');
  if(b){
    var k = b.getAttribute('data-site');
    if(opened[k]) delete opened[k]; else opened[k] = true;
    render(document.getElementById('dateSel').value);
  }
});

fetch('data/index.json').then(function(res){ return res.json(); }).then(function(idx){
  dates = idx.dates;
  var latest = dates[0];
  var gap = Math.floor((Date.now() - new Date(latest)) / 86400000);
  if(gap > 20){
    document.getElementById('notice').innerHTML =
      '<div class="notice">올해 공판이 아직 시작되지 않았습니다. 지금 보시는 자료는 가장 최근 공판일인 <b>' +
      latest.replace(/-/g, '. ') + '</b> 기준입니다. 공판이 열리면 매일 저녁 자동으로 갱신됩니다.</div>';
  }
  var sel = document.getElementById('dateSel');
  sel.innerHTML = dates.map(function(d){
    return '<option value="' + d + '">' + d.replace(/-/g, '. ') + '</option>';
  }).join('');
  sel.onchange = function(){ opened = {}; render(sel.value); };
  document.getElementById('prev').onclick = function(){
    var i = dates.indexOf(sel.value);
    if(i < dates.length - 1){ opened = {}; render(dates[i+1]); }
  };
  document.getElementById('next').onclick = function(){
    var i = dates.indexOf(sel.value);
    if(i > 0){ opened = {}; render(dates[i-1]); }
  };
  render(dates[0]);
}).catch(function(){
  document.getElementById('main').innerHTML = '<div class="empty">자료를 불러오지 못했습니다.</div>';
});
</script>
</body>
</html>
